version: '3.8'

services:

  # ============================================================
  # N8N - Motor de automatización
  # Acceso: http://localhost:5678
  # ============================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: supply-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Autenticación básica
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # URL base (importante para webhooks)
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678}/
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678

      # Variables disponibles en los workflows
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Configuración general
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
      - N8N_LOG_LEVEL=info
      - N8N_METRICS=true

      # Ejecuciones
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=last
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro  # workflows disponibles para importar

    networks:
      - supply-net

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================
  # Frontend - Servidor estático para la terminal web
  # Acceso: http://localhost:3000
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: supply-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - supply-net
    depends_on:
      - n8n

volumes:
  n8n_data:
    name: supply_n8n_data

networks:
  supply-net:
    name: supply_network
    driver: bridge
